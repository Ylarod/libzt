name: Build Wheels

on: [workflow_dispatch]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # SWIG is installed from PyPI as a build dependency (pkg/pypi/pyproject.toml)
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=3,<4"

      # Configuration: [tool.cibuildwheel] in pkg/pypi/pyproject.toml
      - name: Build and test wheels
        run: python -m cibuildwheel pkg/pypi --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
