name: Build Wheels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build:
        description: cibuildwheel build selector, default from pkg/pypi/pyproject.toml
        type: string
        default: ""
      retention-days:
        type: number
        default: 14

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # SWIG is installed from PyPI as a build dependency (pkg/pypi/pyproject.toml)
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=3,<4"

      # Configuration: [tool.cibuildwheel] in pkg/pypi/pyproject.toml. Every
      # wheel is tested with test/offline.py
      - name: Build and test wheels
        env:
          CIBW_BUILD: ${{ inputs.build }}
        run: python -m cibuildwheel pkg/pypi --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: libzt-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}
