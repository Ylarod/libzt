name: Build Java JAR

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        # The JAR is named after the latest tag (git describe)
        fetch-depth: 0

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Build
      run: ./build.sh host-jar "release"

    - uses: actions/upload-artifact@v7
      with:
        name: libzt-jar
        path: dist/*-jar-release/pkg/*.jar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days || 14 }}
