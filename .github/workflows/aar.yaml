name: Build Android AAR

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # Android Gradle Plugin 9 requires JDK 17 or newer
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Build
      run: ./build.sh android-aar "release"

    - uses: actions/upload-artifact@v7
      with:
        name: libzt-android-aar
        path: dist/android-any-android-release/libzt-release.aar
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days || 14 }}
