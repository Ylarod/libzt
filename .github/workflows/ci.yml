name: CI

on:
  push:
    # Version tags are built by release.yml
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C library and the hermetic ctest suites (label "offline": signed local
  # root sets and ad-hoc networks, no Internet access needed)
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 4

      - name: Offline tests
        working-directory: build
        run: ctest -L offline --output-on-failure

      # Talks to the public ZeroTier roots, may be affected by the network
      - name: Network test
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: build
        run: ctest -L network --output-on-failure

  # Same configuration as the release wheels, one interpreter only
  wheels:
    name: Python wheels
    uses: ./.github/workflows/wheels.yml
    with:
      build: cp313-*

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build and test
        working-directory: pkg/crate/libzt
        run: |
          cargo build --examples
          cargo test

  host:
    name: Native libraries
    uses: ./.github/workflows/host.yml

  xcframework:
    name: Apple xcframework
    uses: ./.github/workflows/xcframework.yml

  jar:
    name: Java JAR
    uses: ./.github/workflows/jar.yaml

  aar:
    name: Android AAR
    uses: ./.github/workflows/aar.yaml

  nuget:
    name: NuGet (Windows)
    uses: ./.github/workflows/nuget.yml
