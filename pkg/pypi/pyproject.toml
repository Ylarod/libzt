[build-system]
requires = ["setuptools>=77", "swig>=4.1"]
build-backend = "setuptools.build_meta"

[project]
name = "libzt"
version = "1.16.2"
description = "ZeroTier"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "ZeroTier, Inc.", email = "contact@zerotier.com" }]
maintainers = [{ name = "Joseph Henry", email = "contact@zerotier.com" }]
requires-python = ">=3.9"
keywords = [
    "zerotier",
    "p2p",
    "peer-to-peer",
    "sdwan",
    "sdn",
    "virtual",
    "network",
    "socket",
    "tcp",
    "udp",
    "zt",
    "encryption",
    "encrypted",
]
classifiers = [
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: C++",
]

[project.urls]
Homepage = "https://www.zerotier.com/"
Documentation = "https://docs.zerotier.com/"
GitHub = "https://github.com/zerotier/libzt/"
"Issue Tracker" = "https://github.com/zerotier/libzt/issues"

[tool.setuptools]
packages = ["libzt"]
# The C/C++ sources live outside of this directory (absolute paths in
# SOURCES.txt), they must not be treated as package data
include-package-data = false

# Used by .github/workflows/wheels.yml (all versions) and ci.yml (one version)
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = "auto64"
# Hermetic, needs no Internet access
test-command = "python {project}/test/offline.py"
